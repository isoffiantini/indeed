services:
  - type: web
    name: indeed-schema-api
    runtime: python
    plan: free
    buildCommand: echo "No external dependencies"
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://indeed-test-1d1ed7.pages.xcade.net
      - key: AVATURE_API_KEY
        sync: false
